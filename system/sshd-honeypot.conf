# Настоящий SSH для администратора.
# Копируется в /etc/ssh/sshd_config.d/10-honeypot.conf.
# Порт 22 отдан ловушке, поэтому настоящий SSH слушает 2222
# и пускает только по ключу: подобрать пароль к нему нельзя.
Port 2222
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
