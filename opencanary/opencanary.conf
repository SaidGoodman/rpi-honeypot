{
    "device.node_id": "nas-backup",
    "device.listen_addr": "",
    "ip.ignorelist": [],

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                },
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary.log"
                }
            }
        }
    },

    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "ProFTPD 1.3.5 Server (nas-backup)",
    "ftp.log_auth_attempt_initiated": false,

    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Apache/2.4.25 (Debian)",
    "http.skin": "nasLogin",
    "http.log_unimplemented_method_requests": false,
    "http.log_redirect_request": false,

    "ssh.enabled": true,
    "ssh.port": 22,
    "ssh.version": "SSH-2.0-OpenSSH_7.4p1 Debian-10+deb9u7",

    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "Debian GNU/Linux 9 nas-backup",
    "telnet.max_connections": 64,
    "telnet.timeout": 120,
    "telnet.log_tcp_connection": false,

    "portscan.enabled": true,
    "portscan.logfile": "/var/log/kern.log",
    "portscan.ignore_localhost": true,
    "portscan.ignore_ports": [21, 22, 23, 80, 2222, 5000],
    "portscan.synrate": 50,
    "portscan.nmaposrate": 5,
    "portscan.lorate": 3
}
